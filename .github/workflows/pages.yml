# Publică site-ul (folderul site/) pe GitHub Pages la fiecare push pe main care atinge site/.
# Se publică doar fișierele de care are nevoie browserul (nu build.py, body.html, preview.html).
name: Publicare site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pregătește fișierele publice
        run: |
          mkdir -p site-full
          cp site/index.html site/styles.css site/analytics.js site/antibot.js site/gads.js site/main.js site/calc.js site/search.js site/report.js site/favicon.ico site/site.webmanifest site-full/
          cp -r site/assets site-full/assets
          cp -r site/dezabonare site-full/dezabonare
          cp -r site/confidentialitate site-full/confidentialitate
          cp -r site/termeni site-full/termeni
          mkdir -p public
          if [ -f site/.pauza ]; then
            # PAUZĂ: vizitatorii văd pagina de mentenanță; rămân doar dezabonarea și paginile legale;
            # site-ul complet stă la o adresă secretă (numele din site/.pauza), cu noindex
            SECRET=$(head -n1 site/.pauza | tr -cd 'a-z0-9-')
            cp site/mentenanta.html public/index.html
            cp site/mentenanta.html public/404.html
            cp site/favicon.ico site/site.webmanifest site/styles.css public/
            mkdir -p public/assets
            cp site/assets/logo-pesticid.svg site/assets/favicon-16.png site/assets/favicon-32.png site/assets/apple-touch-icon.png site/assets/icon-192.png site/assets/icon-512.png site/assets/og-image.jpg public/assets/
            cp -r site-full/dezabonare site-full/confidentialitate site-full/termeni public/
            cp -r site-full "public/$SECRET"
            sed -i 's#<meta name="viewport"#<meta name="robots" content="noindex, nofollow">\n<meta name="viewport"#' "public/$SECRET/index.html"
            printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          else
            cp -r site-full/. public/
          fi
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
