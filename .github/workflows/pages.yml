# Publică site-ul (folderul site/) pe GitHub Pages la fiecare push pe main care atinge site/.
# Se publică doar fișierele de care are nevoie browserul (nu build.py, body.html, preview.html).
name: Publicare site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pregătește fișierele publice
        run: |
          mkdir -p public
          cp site/index.html site/styles.css site/analytics.js site/main.js site/calc.js site/search.js site/report.js site/favicon.ico site/site.webmanifest public/
          cp -r site/assets public/assets
          cp -r site/dezabonare public/dezabonare
          cp -r site/confidentialitate public/confidentialitate
          cp -r site/termeni public/termeni
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
