<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroSphere — revenim în curând</title>
<meta name="robots" content="noindex">

<meta property="og:title" content="AgroSphere — Îți calculează doza">
<meta property="og:description" content="Revenim în curând.">
<meta property="og:image" content="https://agrosphere.eu/assets/og-image.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #cedbf6; --fg: #111; --muted: #3b3f4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 32px 16px; background: var(--bg); color: var(--fg); font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
  img { display: block; width: min(320px, 70vw); height: auto; }
  .card { width: min(560px, 100%); background: #fff; border-radius: 40px; box-shadow: 0 30px 40px rgba(0,0,0,.12); padding: 36px 28px; }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
  p { margin: 0; font-size: 16px; line-height: 26px; color: var(--muted); }
  .links { margin-top: 18px; font-size: 14px; }
  .links a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; margin: 0 8px; }
  @media (max-width: 480px) { .card { border-radius: 28px; padding: 28px 20px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
  <img src="/assets/logo-agrosphere.svg" alt="AgroSphere" width="1585" height="311">
  <main class="card">
    <h1>Revenim în curând</h1>
    <p>Pregătim ultimele detalii ale calculatorului de doză pentru pesticide. Revino peste câteva zile.</p>
    <p class="links"><a href="/confidentialitate/">Confidențialitate</a><a href="/termeni/">Termeni și condiții</a></p>
  </main>
</body>
</html>
